lugins {
    id 'java'
    id 'application'
}

group = 'com.leangains'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
    
    // Mockito for mocking in tests
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'
}

application {
    mainClass = 'com.leangains.MathematicalOperations'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
    
    // Enable parallel test execution
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
}

// Task to run the application
task runApp(type: JavaExec) {
    group = 'application'
    description = 'Run the Mathematical Operations application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.leangains.MathematicalOperations'
    
    // Enable console input
    standardInput = System.in
}

// Task to create a fat JAR
task fatJar(type: Jar) {
    group = 'build'
    description = 'Create a fat JAR with all dependencies'
    archiveClassifier = 'all'
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    with jar
    
    manifest {
        attributes(
            'Main-Class': 'com.leangains.MathematicalOperations',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'LeanGains',
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().toString(),
            'Built-JDK': System.getProperty('java.version')
        )
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Task to generate wrapper
wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.ALL
}

// Clean task enhancement
clean {
    delete 'out'
    delete 'logs'
}

// Custom task to display project information
task projectInfo {
    group = 'help'
    description = 'Display project information'
    
    doLast {
        println """
        |Project Information:
        |  Name: ${project.name}
        |  Version: ${project.version}
        |  Group: ${project.group}
        |  Java Version: ${sourceCompatibility}
        |  Main Class: ${application.mainClass.get()}
        |  
        |Available tasks:
        |  ./gradlew run          - Run the application
        |  ./gradlew runApp       - Run the application (alternative)
        |  ./gradlew build        - Build the project
        |  ./gradlew test         - Run tests
        |  ./gradlew fatJar       - Create executable JAR with dependencies
        |  ./gradlew clean        - Clean build artifacts
        """.stripMargin()
    }
}